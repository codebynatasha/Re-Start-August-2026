<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Design Basic</title>
    <style>
      /* Tablet / Small Screens */
      @media (min-width: 768px) {
        .container {
          display: flex;
          gap: 20px;
        }
      }
      /* Desktop Screens */
      @media (min-width: 1080px) {
        .container {
          max-width: 1200px;
          margin: auto;
        }
      }

      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      /* Container */
      /* .container {
      
      } */

      /* Card */
      .card {
        border: 1px solid  gray;
        margin-bottom: 20px;
        padding: 15px;
      }

      /* Card Image */
      .card img {
        width: 100%;
        height: auto;
        display: block;
      }
      h1 {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Responsive Design Demo</h1>

    <div class="container">
      <div class="card">
        <img src="https://picsum.photos/300/200" alt="Laptop" />
        <h2>Laptop</h2>
        <p>Powerful laptop for developers.</p>
      </div>

      <div class="card">
        <img src="https://picsum.photos/300/200?2" alt="Phone" />
        <h2>Phone</h2>
        <p>Latest smartphone.</p>
      </div>

      <div class="card">
        <img src="https://picsum.photos/300/200?3" alt="Headphones" />
        <h2>Headphones</h2>
        <p>Wireless headphones.</p>
      </div>
    </div>
  </body>
</html>
