<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Var's in CSS</title>
    <style>
        :root{
            --radius:32px;
            font-size: 20px;
        }
        .card{
            --text-color: purple ;
            color: var(--text-color);
            border: 2px solid black;
            border-radius: var(--radius);
            text-align: center;
        }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Title</h2>
      <p>
        AOA!
        <br />
        Student
      </p>
    </div>
  </body>
</html>
