<!-- Grid Layout Basics - Practical Example -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout Basics - Practical</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr 3fr;
        gap: 10px;
      }

      .header {
        grid-column: 1/3;
        padding: 20px;
       background: #2196f3;
       color: white;
       text-align: center;

      }

      .Sidebar {
        padding: 20px;
       background: #4caf50;
       color: white;
       text-align: center;

      }

      .content {
        padding: 20px;
       background: #ff9800;
       color: white;
       text-align: center;
    }

    .footer {
        grid-column: 1/3;
        padding: 20px;
       background: #333;
       color: white;
       text-align: center;

      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Header</div>
      <div class="Sidebar">Sidebar</div>
      <div class="content">content</div>
      <div class="footer">Footer</div>
    </div>
  </body>
</html>
