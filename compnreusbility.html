    <script src="https://cdn.tailwindcss.com"></script>

  <body>

    <button

      Login
    </button>
    <button

      class="bg-blue-600 text-white text-center font-bold px-4 py-2 rounded hover:bg-blue-700"

      Checkout
    </button>
<br>
    <!-- Cards Example -->
