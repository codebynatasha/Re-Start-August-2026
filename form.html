<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms-HTML</title>
  </head>
  <body>
    <label for="name"> Name</label> <br />
    <input
      type="text"
      id="name"
      required
      placeholder="Enter your Name"
      maxlength="15"/>    <br /><br />

    <label for="email"> Email</label> <br />
    <input
      type="email"
      id="email"
      required
      placeholder="Enter your valid email"/><br /><br />

    <label for="password"> Password</label> <br />
    <input
      type="password"
      id="password"
      placeholder="Enter your valid password"
      minlength="8"/><br /><br />

    <label> Gender</label> <br />
    <input type="radio" name=" Gender " /> Male
    <input type="radio" name=" Gender " /> Female <br /> <br />

    <label for="country">Country</label> <br />
    <select id="country">
      <option>Pakistan</option>
      <option>Turkey</option>
      <option>Iran</option>
      <option>Palestian</option>
      <option>Germany</option>
    </select> <br /><br />

    <label for="address"> Address</label> <br />
    <textarea
      name=""
      id="address"
      required
      placeholder="Enter your valid address"
      maxlength="50" rows="4" cols="30"></textarea> <br /><br />

    <label for="picture">Profile Picture</label> <br />
    <input type="file" id="picture" /> <br /> <br />

    <input type="checkbox" required /> I accept the Term & Condition <br /><br />
    <input type="submit" value="Register"/>
  </body>
</html>
