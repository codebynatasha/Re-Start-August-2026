<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nav Bar</title>
</head>
<body>
  <style>
    body {
        margin: 0;
        font-family: Arial;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1e293b;
        color: white;
        padding: 15px 20px;
    }

    .menu {
        display: flex;
        gap: 20px;
    }

    .menu a {
        color: white;
        text-decoration: none;
    }
</style>
</head>
<body>
  <div class="navbar">
        <h2>My Website</h2>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </div>
    </div>
</body>
</html>
